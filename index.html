<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131c">
    <title>Calculator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10131c;
        color: #f5f6fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(91 91 214 / 18%), transparent 48%),
          #10131c;
      }

      .calculator {
        width: min(100%, 360px);
        padding: 24px;
        border: 1px solid rgb(255 255 255 / 9%);
        border-radius: 28px;
        background: #191d29;
        box-shadow: 0 24px 70px rgb(0 0 0 / 40%);
      }

      .heading {
        margin: 0 0 24px;
        color: #9da4b8;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .display {
        min-height: 132px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        overflow: hidden;
        padding: 8px 2px 24px;
      }

      .expression {
        min-height: 24px;
        max-width: 100%;
        overflow: hidden;
        color: #9299ac;
        font-size: 1rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .result {
        max-width: 100%;
        overflow: hidden;
        font-size: clamp(2.5rem, 12vw, 3.5rem);
        font-variant-numeric: tabular-nums;
        font-weight: 500;
        letter-spacing: -0.06em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        min-width: 0;
        aspect-ratio: 1;
        border: 0;
        border-radius: 18px;
        background: #252a39;
        color: #f5f6fa;
        cursor: pointer;
        font: inherit;
        font-size: 1.25rem;
        transition: background 120ms ease, transform 120ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      button:hover {
        background: #303649;
      }

      button:active {
        transform: scale(0.96);
      }

      button:focus-visible {
        outline: 2px solid #a8a2ff;
        outline-offset: 3px;
      }

      .utility {
        color: #b6b9c9;
        font-size: 1rem;
      }

      .operator {
        background: #30334b;
        color: #b9b4ff;
        font-size: 1.4rem;
      }

      .operator:hover {
        background: #3a3e59;
      }

      .equals {
        background: #7669e8;
        color: #fff;
        font-size: 1.5rem;
      }

      .equals:hover {
        background: #887cf3;
      }

      .zero {
        grid-column: span 2;
        aspect-ratio: auto;
        text-align: left;
        padding-left: 28px;
      }

      @media (max-width: 380px) {
        .calculator {
          padding: 18px;
        }

        .keys {
          gap: 9px;
        }

        button {
          border-radius: 15px;
        }
      }
    </style>
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <h1 class="heading">Calculator</h1>
      <section class="display" aria-live="polite" aria-atomic="true">
        <div class="expression" id="expression"></div>
        <output class="result" id="result">0</output>
      </section>
      <div class="keys">
        <button class="utility" type="button" data-action="clear" aria-label="Clear">AC</button>
        <button class="utility" type="button" data-action="sign" aria-label="Change sign">+/-</button>
        <button class="utility" type="button" data-action="backspace" aria-label="Delete last digit">DEL</button>
        <button class="operator" type="button" data-operator="/" aria-label="Divide">÷</button>

        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button class="operator" type="button" data-operator="*" aria-label="Multiply">×</button>

        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button class="operator" type="button" data-operator="-" aria-label="Subtract">−</button>

        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button class="operator" type="button" data-operator="+" aria-label="Add">+</button>

        <button class="zero" type="button" data-digit="0">0</button>
        <button type="button" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="equals" type="button" data-action="equals" aria-label="Equals">=</button>
      </div>
    </main>
    <script>
      const resultDisplay = document.querySelector("#result");
      const expressionDisplay = document.querySelector("#expression");
      const keys = document.querySelector(".keys");
      const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

      let current = "0";
      let previous = null;
      let operator = null;
      let shouldReset = false;

      function render() {
        resultDisplay.textContent = current;
        expressionDisplay.textContent = previous === null
          ? ""
          : `${previous} ${symbols[operator] ?? ""}`;
      }

      function enterDigit(digit) {
        if (shouldReset || current === "Error") {
          current = digit;
          shouldReset = false;
        } else if (current === "0") {
          current = digit;
        } else if (current.replace("-", "").length < 14) {
          current += digit;
        }
        render();
      }

      function enterDecimal() {
        if (shouldReset || current === "Error") {
          current = "0.";
          shouldReset = false;
        } else if (!current.includes(".")) {
          current += ".";
        }
        render();
      }

      function calculate(left, right, operation) {
        switch (operation) {
          case "+": return left + right;
          case "-": return left - right;
          case "*": return left * right;
          case "/": return right === 0 ? NaN : left / right;
          default: return right;
        }
      }

      function format(value) {
        if (!Number.isFinite(value)) return "Error";
        return String(Number(value.toPrecision(10)));
      }

      function chooseOperator(nextOperator) {
        if (current === "Error") return;
        const value = Number(current);

        if (operator && !shouldReset) {
          current = format(calculate(Number(previous), value, operator));
          if (current === "Error") {
            previous = null;
            operator = null;
            shouldReset = true;
            render();
            return;
          }
        }

        previous = current;
        operator = nextOperator;
        shouldReset = true;
        render();
      }

      function equals() {
        if (!operator || previous === null || current === "Error") return;
        const left = previous;
        const right = current;
        current = format(calculate(Number(left), Number(right), operator));
        expressionDisplay.textContent = `${left} ${symbols[operator]} ${right} =`;
        previous = null;
        operator = null;
        shouldReset = true;
        resultDisplay.textContent = current;
      }

      function clear() {
        current = "0";
        previous = null;
        operator = null;
        shouldReset = false;
        render();
      }

      function backspace() {
        if (shouldReset || current === "Error") {
          current = "0";
          shouldReset = false;
        } else {
          current = current.length > 1
            ? current.slice(0, -1)
            : "0";
          if (current === "-") current = "0";
        }
        render();
      }

      function toggleSign() {
        if (current === "Error" || Number(current) === 0) return;
        current = current.startsWith("-") ? current.slice(1) : `-${current}`;
        shouldReset = false;
        render();
      }

      function handleAction(action) {
        if (action === "clear") clear();
        if (action === "decimal") enterDecimal();
        if (action === "backspace") backspace();
        if (action === "sign") toggleSign();
        if (action === "equals") equals();
      }

      keys.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;

        if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
        if (button.dataset.operator) chooseOperator(button.dataset.operator);
        if (button.dataset.action) handleAction(button.dataset.action);
      });

      document.addEventListener("keydown", (event) => {
        if (/^\d$/.test(event.key)) enterDigit(event.key);
        else if (event.key === ".") enterDecimal();
        else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
        else if (event.key === "Enter" || event.key === "=") {
          event.preventDefault();
          equals();
        } else if (event.key === "Escape") clear();
        else if (event.key === "Backspace") backspace();
      });
    </script>
  </body>
</html>
